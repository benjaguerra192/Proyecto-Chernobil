<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CHERNOBYL VR | Experiencia Inmersiva</title>
    
    <!-- SEO & Social Media -->
    <meta name="description" content="Explora el reactor 4 de Chernobyl en una experiencia VR inmersiva y educativa.">
    <meta name="keywords" content="Chernobyl, VR, Realidad Virtual, A-Frame, Historia, Reactor 4">
    <meta property="og:title" content="CHERNOBYL VR | Experiencia Inmersiva">
    <meta property="og:description" content="Recorrido histórico interactivo por la sala de control del reactor 4.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#ff6600">

    <!-- Fonts & A-Frame -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;600;900&display=swap" rel="stylesheet">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
        :root {
            --primary: #ff6600;
            --primary-glow: rgba(255, 102, 0, 0.4);
            --secondary: #00eeff;
            --danger: #ff0000;
            --bg: #030303;
            --glass: rgba(10, 10, 10, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font: 'Inter', sans-serif;
            --ease: cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); font-family: var(--font); color: white; overflow: hidden; height: 100dvh; }

        /* ── CINEMATIC LAUNCHER ─────────────────────────── */
        #launcher {
            position: fixed; inset: 0; z-index: 9999;
            background: radial-gradient(circle at center, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.95) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 2.5s var(--ease), visibility 2.5s;
            backdrop-filter: blur(10px);
        }
        #launcher.hidden { opacity: 0; visibility: hidden; }

        .launcher-content { position: relative; text-align: center; max-width: 800px; padding: 40px; animation: contentEnter 2s var(--ease); }
        @keyframes contentEnter { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .launcher-eyebrow { font-size: 0.6rem; letter-spacing: 0.8em; color: var(--primary); text-transform: uppercase; margin-bottom: 20px; font-weight: 800; }
        #launcher h1 {
            font-size: clamp(3.5rem, 15vw, 7.5rem); font-weight: 900; letter-spacing: -0.04em;
            text-transform: uppercase; line-height: 0.85; margin-bottom: 60px;
            color: #fff; filter: drop-shadow(0 0 30px var(--primary-glow));
        }

        .launcher-btn {
            background: transparent; border: 1px solid var(--primary); color: var(--primary);
            padding: 24px 80px; font-size: 0.75rem; letter-spacing: 0.5em; font-weight: 700;
            text-transform: uppercase; cursor: pointer; transition: all 0.5s var(--ease);
            background: rgba(255, 102, 0, 0.05);
        }
        .launcher-btn:hover:not(:disabled) { background: var(--primary); color: black; box-shadow: 0 0 50px var(--primary-glow); transform: scale(1.05); }
        .launcher-btn:disabled { opacity: 0.3; cursor: wait; }

        /* ── UI SYSTEM ────────────────────────────────────── */
        #ui-system { position: fixed; inset: 0; pointer-events: none; z-index: 500; opacity: 0; transition: opacity 0.5s var(--ease); }
        #ui-system.visible { opacity: 1; pointer-events: auto; }

        .topbar {
            position: absolute; top: 0; left: 0; right: 0; padding: 20px 40px;
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            pointer-events: auto;
        }
        .btn-ui {
            background: var(--glass); border: 1px solid var(--glass-border); color: white;
            padding: 14px 28px; font-size: 0.55rem; letter-spacing: 0.3em; font-weight: 700;
            text-transform: uppercase; cursor: pointer; transition: all 0.3s;
        }
        .btn-ui:hover { background: white; color: black; transform: translateY(-2px); }

        #drawer {
            position: absolute; top: 0; left: 0; width: 400px; height: 100%;
            background: var(--glass); backdrop-filter: blur(50px); border-right: 1px solid var(--glass-border);
            transform: translateX(-100%); transition: transform 0.6s var(--ease);
            display: flex; flex-direction: column; pointer-events: auto;
        }
        #drawer.open { transform: translateX(0); }
        .drawer-head { padding: 60px 40px; border-bottom: 1px solid var(--glass-border); position: relative; }
        .btn-close-drawer { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: white; cursor: pointer; font-size: 1.2rem; opacity: 0.5; transition: 0.3s; }
        .btn-close-drawer:hover { opacity: 1; transform: rotate(90deg); }
        
        #scene-list { flex: 1; overflow-y: auto; padding: 30px; }
        .scene-item {
            padding: 24px; border-radius: 2px; cursor: pointer; border: 1px solid transparent;
            transition: all 0.4s var(--ease); margin-bottom: 12px; background: rgba(255,255,255,0.02);
        }
        .scene-item:hover { background: rgba(255,102,0,0.08); border-color: rgba(255,102,0,0.2); }
        .scene-item.active { background: rgba(255,102,0,0.15); border-color: var(--primary); }
        .scene-hud { 
            position: absolute; bottom: 50px; right: 50px; 
            pointer-events: none; text-align: right; z-index: 400;
            transition: opacity 0.4s var(--ease);
        }
        #drawer.open ~ .scene-hud { opacity: 0; }
        .hud-name { font-size: 2.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1; color: white; }
        .hud-sub { font-size: 0.7rem; letter-spacing: 0.5em; color: var(--primary); margin-top: 10px; font-weight: 300; }

        /* Transition Overlays */
        #scene-loader {
            position: fixed; inset: 0; z-index: 8000; background: black;
            display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.6s;
        }
        #scene-loader.active { display: flex; opacity: 1; }
        .loader-spinner { width: 50px; height: 50px; border: 1px solid rgba(255,102,0,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #cooldown-overlay {
            position: fixed; inset: 0; z-index: 8500; pointer-events: none;
            display: flex; align-items: flex-end; justify-content: center; padding-bottom: 100px; opacity: 0; transition: opacity 0.5s;
        }
        #cooldown-overlay.active { opacity: 1; }
        .cooldown-bar { width: 300px; height: 1px; background: rgba(255,255,255,0.1); }
        .cooldown-fill { height: 100%; width: 0%; background: var(--primary); transition: width 2.5s linear; }
    </style>
</head>
<body>

    <!-- Cinematic Entry Launcher -->
    <div id="launcher">
        <div class="launcher-content">
            <div class="launcher-eyebrow">Visual Archives | 04.26.1986</div>
            <h1>Chernobyl</h1>
            <button id="btn-start" class="launcher-btn" disabled>Sincronizando Archivos...</button>
        </div>
    </div>

    <!-- Desktop/Mobile UI -->
    <div id="ui-system">
        <div class="topbar">
            <button class="btn-ui" id="ui-btn-menu">Explorar Galerías</button>
            <button class="btn-ui" id="ui-btn-vr">Entrar VR</button>
        </div>
        <div id="drawer">
            <div class="drawer-head">
                <button class="btn-close-drawer" id="ui-close-drawer">×</button>
                <h3 style="letter-spacing: 0.3em; color: var(--primary);">REGISTROS</h3>
            </div>
            <div id="scene-list"></div>
        </div>
        <div class="scene-hud">
            <div class="hud-name" id="ui-scene-name">EXTERIOR REACTOR 4</div>
        </div>
    </div>

    <div id="scene-loader">
        <div class="loader-spinner"></div>
    </div>

    <div id="cooldown-overlay">
        <div class="cooldown-bar"><div id="cooldown-fill" class="cooldown-fill"></div></div>
    </div>

    <!-- 3D Scene -->
    <a-scene
        renderer="antialias: true; colorManagement: true; logarithmicDepthBuffer: true; highRefreshRate: true;"
    <!-- VR Scene Core -->
    <a-scene 
        renderer="antialias: true; colorManagement: true; physicallyCorrectLights: false;"
        cursor="fuse: false; rayOrigin: mouse"
        raycaster="objects: .clickable; far: 50;"
        vr-mode-ui="enabled: false">
        
        <a-assets>
            <audio id="snd-click" src="https://cdn.aframe.io/360-video-example/audio/click.mp3"></audio>
            <audio id="snd-ambient" src="Audios/ambiente.mp3" preload="auto" loop="true"></audio>
        </a-assets>

        <!-- Camera System -->
        <a-entity id="camera-rig" position="0 0 0">
            <a-camera id="main-camera" fov="90" look-controls="pointerLockEnabled: false">
                <!-- Gaze Cursor for Cardboard VR -->
                <a-entity id="gaze-cursor"
                    cursor="fuse: true; fuseTimeout: 1200"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                    material="color: white; shader: flat; opacity: 0.6"
                    raycaster="objects: .clickable"
                    visible="false"
                    animation__fusing="property: scale; from: 1 1 1; to: 0.1 0.1 0.1; dur: 1200; startEvents: fusing"
                    animation__reset="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave">
                </a-entity>
            </a-camera>
        </a-entity>

        <a-sky id="sky-display" radius="100" rotation="0 -90 0" segments-height="64" segments-width="64"></a-sky>
        
        <a-entity id="hotspot-container"></a-entity>
        <a-entity id="panel-container" position="0 0 0"></a-entity>
        <a-entity id="vr-menu-root"></a-entity>

    </a-scene>

    <script>
        /**
         * CHERNOBYL VR | ENGINE V2
         * Centralized State Management & Robust Modular Architecture
         */
        const App = {
            state: {
                scenes: {},
                currentScene: null,
                isVR: false,
                initialized: false
            },

            init() {
                console.log("[Engine] Initializing Core...");
                this.Discovery.run();
                this.UI.bind();
                
                // Track VR Mode
                document.querySelector('a-scene').addEventListener('enter-vr', () => {
                    App.state.isVR = true;
                    const gaze = document.getElementById('gaze-cursor');
                    if (gaze) gaze.setAttribute('visible', 'true');
                });
                document.querySelector('a-scene').addEventListener('exit-vr', () => {
                    App.state.isVR = false;
                    const gaze = document.getElementById('gaze-cursor');
                    if (gaze) gaze.setAttribute('visible', 'false');
                });
            },

            async start() {
                const btn = document.getElementById('btn-start');
                btn.disabled = true;
                btn.innerText = "ACCEDIENDO...";
                
                try {
                    document.getElementById('launcher').classList.add('hidden');
                    document.getElementById('ui-system').classList.add('visible');
                    
                    // Initial Scene Load
                    await this.Scene.load("menu_principal.png");
                    
                    // Start Background Audio
                    const ambient = document.getElementById('snd-ambient');
                    ambient.play().catch(() => console.warn("Audio waiting for interaction."));
                } catch (e) {
                    console.error("Engine Start Fail:", e);
                }
            }
        };

        // ── SCENE MANAGER ────────────────────────────────────
        App.Scene = {
            async load(id) {
                if (App.state.currentScene === id) return;
                
                const loader = document.getElementById('scene-loader');
                loader.style.display = 'flex';
                loader.classList.add('active');

                // Update State
                App.state.currentScene = id;
                const sceneData = App.Discovery.get(id);

                return new Promise(resolve => {
                    const sky = document.getElementById('sky-display');
                    
                    // Cleanup Previous
                    App.Hotspots.clear();
                    App.VRMenu.clear();

                    // Preload Image
                    const img = new Image();
                    img.onload = () => {
                        sky.setAttribute('src', `Imagenes/${id}`);
                        
                        // Update 2D HUD
                        document.getElementById('ui-scene-name').textContent = sceneData.title;
                        
                        // Highlight in List
                        document.querySelectorAll('.scene-item').forEach(el => {
                            el.classList.toggle('active', el.dataset.id === id);
                        });

                        // Rebuild 3D Layers
                        App.Hotspots.spawn(id);
                        App.VRMenu.build();

                        // Smooth Fade Out
                        setTimeout(() => {
                            loader.classList.remove('active');
                            setTimeout(() => {
                                loader.style.display = 'none';
                                resolve();
                            }, 800);
                        }, 500);
                    };
                    img.src = `Imagenes/${id}`;
                });
            }
        };

        // ── ASSET DISCOVERY ──────────────────────────────────
        App.Discovery = {
            registry: {
                "menu_principal.png": { title: "Exterior Reactor 4", meta: "ZONA DE EXCLUSIÓN" },
                "control_room_1.png": { title: "Sala de Control A", meta: "BLOQUE 1" },
                "control_room_2.png": { title: "Sala de Control B", meta: "BLOQUE 2" },
                "control_room_3.png": { title: "Sala de Control C", meta: "SITIO DE FALLA" },
                "control_room_3_quemado.png": { title: "Reactor 4 (Colapso)", meta: "DÍA CERO" },
                "control_room_4.png": { title: "Sala de Control D", meta: "PUNTO CRÍTICO" }
            },

            run() {
                // Initialize with hardcoded registry first
                Object.keys(this.registry).forEach(id => this.add(id));
                
                // Then try to probe in background
                ["room_5.png", "exterior_1.jpg", "scene_2.webp"].forEach(id => this.probe(id));
            },

            add(id) {
                if (App.state.scenes[id]) return;
                const info = this.registry[id] || { title: this.clean(id), meta: "DESCUBIERTO" };
                App.state.scenes[id] = { id, ...info };
                this.renderUI();
            },

            async probe(id) {
                const img = new Image();
                img.onload = () => this.add(id);
                img.src = `Imagenes/${id}`;
            },

            get(id) {
                return App.state.scenes[id] || { title: "Sector Desconocido", meta: "INVESTIGACIÓN" };
            },

            clean(id) {
                return id.split('.')[0].replace(/_/g, " ").toUpperCase();
            },

            renderUI() {
                const list = document.getElementById('scene-list');
                list.innerHTML = "";
                Object.values(App.state.scenes).forEach(s => {
                    const el = document.createElement('div');
                    el.className = "scene-item" + (App.state.currentScene === s.id ? " active" : "");
                    el.dataset.id = s.id;
                    el.innerHTML = `
                        <div class="scene-item-meta">${s.meta}</div>
                        <div class="scene-item-name">${s.title}</div>
                    `;
                    el.onclick = () => App.Scene.load(s.id);
                    list.appendChild(el);
                });
            }
        };

        // ── HOTSPOT SYSTEM ───────────────────────────────────
        App.Hotspots = {
            db: {
                "menu_principal.png": [
                    { pos: "-6 3 -12", title: "SARCÓFAGO", desc: "Contenedor original de 1986, diseñado para durar 30 años antes del Nuevo Confinamiento Seguro." },
                    { pos: "12 5 -8", title: "NUEVO CONFINAMIENTO", desc: "La estructura móvil más grande del mundo, cubriendo los restos radiactivos del Bloque 4." }
                ],
                "control_room_3_quemado.png": [
                    { pos: "0 1.2 -3.5", danger: true, title: "NÚCLEO EXPUESTO", desc: "Altísimos niveles de radiación gamma detectados en los restos de grafito y combustible." }
                ]
            },

            clear() {
                document.getElementById('hotspot-container').innerHTML = "";
                document.getElementById('panel-container').innerHTML = "";
            },

            spawn(id) {
                const root = document.getElementById('hotspot-container');
                const items = this.db[id] || [{ pos: "3 1.5 -5", title: "ZONA EXPLORABLE", desc: "Este sector está bajo análisis técnico. Mantenga distancia de los restos metálicos." }];

                items.forEach(h => {
                    const el = document.createElement('a-entity');
                    el.setAttribute('class', 'clickable');
                    el.setAttribute('position', h.pos);
                    el.setAttribute('look-at', '[camera]');
                    
                    el.innerHTML = `
                        <a-circle radius="0.12" material="color: ${h.danger ? '#ff3300' : '#ff6600'}; opacity: 0.9; shader: flat"></a-circle>
                        <a-ring radius-inner="0.13" radius-outer="0.16" material="color: white; opacity: 0.4; shader: flat"
                            animation="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dur: 1500; loop: true; dir: alternate"></a-ring>
                    `;

                    el.addEventListener('click', () => this.showPanel(h));
                    root.appendChild(el);
                });
            },

            showPanel(h) {
                const root = document.getElementById('panel-container');
                root.innerHTML = "";
                
                const panel = document.createElement('a-entity');
                panel.setAttribute('position', '0 1.6 -2.5');
                panel.setAttribute('look-at', '[camera]');
                
                panel.innerHTML = `
                    <a-plane width="3.2" height="1.6" material="color: #000; opacity: 0.96; shader: flat">
                        <a-text value="${h.title}" align="center" width="4.5" position="0 0.5 0.02" color="#ff6600"></a-text>
                        <a-text value="${h.desc}" align="center" width="3" position="0 -0.05 0.02" wrap-count="30"></a-text>
                        <a-plane class="clickable" width="1" height="0.35" position="0 -0.55 0.05" material="color: #ff6600; shader: flat">
                            <a-text value="CERRAR" align="center" width="3" position="0 0 0.01" color="#000"></a-text>
                        </a-plane>
                    </a-plane>
                `;
                
                panel.querySelector('a-plane.clickable').addEventListener('click', () => {
                    root.innerHTML = "";
                    document.getElementById('snd-click').play();
                });
                
                root.appendChild(panel);
                document.getElementById('snd-click').play();
            }
        };

        // ── VR HUD & NAVIGATION ─────────────────────────────
        App.VRMenu = {
            clear() { document.getElementById('vr-menu-root').innerHTML = ""; },

            build() {
                const root = document.getElementById('vr-menu-root');
                const menu = document.createElement('a-entity');
                menu.setAttribute('position', '0 0.6 -3');
                menu.setAttribute('rotation', '-20 0 0');

                // Cinematic UI Panel
                menu.innerHTML = `
                    <a-plane width="3" height="0.6" material="color: #111; opacity: 0.9; shader: flat; transparent: true">
                        <a-ring radius-inner="1.5" radius-outer="1.51" scale="2 0.4 1" material="color: #ff6600; opacity: 0.2"></a-ring>
                    </a-plane>
                `;

                const btnPrev = this.btn("< ANTERIOR", -1, () => this.nav(-1));
                const btnHome = this.btn("VOLVER AL INICIO", 0, () => App.Scene.load("menu_principal.png"));
                const btnNext = this.btn("SIGUIENTE >", 1, () => this.nav(1));

                menu.appendChild(btnPrev);
                menu.appendChild(btnHome);
                menu.appendChild(btnNext);
                root.appendChild(menu);
            },

            btn(label, x, cb) {
                const el = document.createElement('a-entity');
                el.setAttribute('position', `${x} 0 0.05`);
                el.setAttribute('class', 'clickable');
                el.innerHTML = `
                    <a-plane width="0.8" height="0.4" material="color: #222; opacity: 0.6; shader: flat"></a-plane>
                    <a-text value="${label}" align="center" width="2.5" position="0 0 0.01" shader="msdf"></a-text>
                `;
                el.addEventListener('mouseenter', () => el.querySelector('a-plane').setAttribute('material', 'color', '#ff6600'));
                el.addEventListener('mouseleave', () => el.querySelector('a-plane').setAttribute('material', 'color', '#222'));
                el.addEventListener('click', () => { cb(); document.getElementById('snd-click').play(); });
                return el;
            },

            nav(dir) {
                const scenes = Object.keys(App.state.scenes);
                let idx = scenes.indexOf(App.state.currentScene) + dir;
                if (idx < 0) idx = scenes.length - 1;
                if (idx >= scenes.length) idx = 0;
                App.Scene.load(scenes[idx]);
            }
        };

        // ── UI BINDINGS ──────────────────────────────────────
        App.UI = {
            bind() {
                document.getElementById('btn-start').onclick = () => App.start();
                document.getElementById('ui-btn-menu').onclick = () => document.getElementById('drawer').classList.add('open');
                document.getElementById('ui-close-drawer').onclick = () => document.getElementById('drawer').classList.remove('open');
                document.getElementById('ui-btn-vr').onclick = () => document.querySelector('a-scene').enterVR();
            }
        };

        // Initial Boot
        window.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
</body>
</html>
