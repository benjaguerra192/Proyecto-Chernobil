<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CHERNOBYL VR | Experiencia Inmersiva</title>
    
    <!-- SEO & Social Media -->
    <meta name="description" content="Explora el reactor 4 de Chernobyl en una experiencia VR inmersiva y educativa.">
    <meta name="keywords" content="Chernobyl, VR, Realidad Virtual, A-Frame, Historia, Reactor 4">
    <meta property="og:title" content="CHERNOBYL VR | Experiencia Inmersiva">
    <meta property="og:description" content="Recorrido histórico interactivo por la sala de control del reactor 4.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#ff6600">

    <!-- Fonts & A-Frame -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;600;900&display=swap" rel="stylesheet">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
        :root {
            --primary: #ff6600;
            --primary-glow: rgba(255, 102, 0, 0.4);
            --secondary: #00eeff;
            --danger: #ff0000;
            --bg: #030303;
            --glass: rgba(10, 10, 10, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font: 'Inter', sans-serif;
            --ease: cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); font-family: var(--font); color: white; overflow: hidden; height: 100dvh; }

        /* ── CINEMATIC LAUNCHER ─────────────────────────── */
        #launcher {
            position: fixed; inset: 0; z-index: 9999;
            background: radial-gradient(circle at center, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.95) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 2.5s var(--ease), visibility 2.5s;
            backdrop-filter: blur(10px);
        }
        #launcher.hidden { opacity: 0; visibility: hidden; }

        .launcher-content { position: relative; text-align: center; max-width: 800px; padding: 40px; animation: contentEnter 2s var(--ease); }
        @keyframes contentEnter { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .launcher-eyebrow { font-size: 0.6rem; letter-spacing: 0.8em; color: var(--primary); text-transform: uppercase; margin-bottom: 20px; font-weight: 800; }
        #launcher h1 {
            font-size: clamp(3.5rem, 15vw, 7.5rem); font-weight: 900; letter-spacing: -0.04em;
            text-transform: uppercase; line-height: 0.85; margin-bottom: 60px;
            color: #fff; filter: drop-shadow(0 0 30px var(--primary-glow));
        }

        .launcher-btn {
            background: transparent; border: 1px solid var(--primary); color: var(--primary);
            padding: 24px 80px; font-size: 0.75rem; letter-spacing: 0.5em; font-weight: 700;
            text-transform: uppercase; cursor: pointer; transition: all 0.5s var(--ease);
            background: rgba(255, 102, 0, 0.05);
        }
        .launcher-btn:hover:not(:disabled) { background: var(--primary); color: black; box-shadow: 0 0 50px var(--primary-glow); transform: scale(1.05); }
        .launcher-btn:disabled { opacity: 0.3; cursor: wait; }

        /* ── UI SYSTEM ────────────────────────────────────── */
        #ui-system { position: fixed; inset: 0; pointer-events: none; z-index: 500; opacity: 0; transition: opacity 0.5s var(--ease); }
        #ui-system.visible { opacity: 1; pointer-events: auto; }

        .topbar {
            position: absolute; top: 0; left: 0; right: 0; padding: 20px 40px;
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            pointer-events: auto;
        }
        .btn-ui {
            background: var(--glass); border: 1px solid var(--glass-border); color: white;
            padding: 14px 28px; font-size: 0.55rem; letter-spacing: 0.3em; font-weight: 700;
            text-transform: uppercase; cursor: pointer; transition: all 0.3s;
        }
        .btn-ui:hover { background: white; color: black; transform: translateY(-2px); }

        #drawer {
            position: absolute; top: 0; left: 0; width: 400px; height: 100%;
            background: var(--glass); backdrop-filter: blur(50px); border-right: 1px solid var(--glass-border);
            transform: translateX(-100%); transition: transform 0.6s var(--ease);
            display: flex; flex-direction: column; pointer-events: auto;
        }
        #drawer.open { transform: translateX(0); }
        .drawer-head { padding: 60px 40px; border-bottom: 1px solid var(--glass-border); position: relative; }
        .btn-close-drawer { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: white; cursor: pointer; font-size: 1.2rem; opacity: 0.5; transition: 0.3s; }
        .btn-close-drawer:hover { opacity: 1; transform: rotate(90deg); }
        
        #scene-list { flex: 1; overflow-y: auto; padding: 30px; }
        .scene-item {
            padding: 24px; border-radius: 2px; cursor: pointer; border: 1px solid transparent;
            transition: all 0.4s var(--ease); margin-bottom: 12px; background: rgba(255,255,255,0.02);
        }
        .scene-item:hover { background: rgba(255,102,0,0.08); border-color: rgba(255,102,0,0.2); }
        .scene-item.active { background: rgba(255,102,0,0.15); border-color: var(--primary); }

        .scene-hud { position: absolute; bottom: 60px; left: 60px; pointer-events: none; }
        .hud-name { font-size: 2.5rem; font-weight: 100; text-transform: uppercase; letter-spacing: 0.05em; }

        /* Transition Overlays */
        #scene-loader {
            position: fixed; inset: 0; z-index: 8000; background: black;
            display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.6s;
        }
        #scene-loader.active { display: flex; opacity: 1; }
        .loader-spinner { width: 50px; height: 50px; border: 1px solid rgba(255,102,0,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #cooldown-overlay {
            position: fixed; inset: 0; z-index: 8500; pointer-events: none;
            display: flex; align-items: flex-end; justify-content: center; padding-bottom: 100px; opacity: 0; transition: opacity 0.5s;
        }
        #cooldown-overlay.active { opacity: 1; }
        .cooldown-bar { width: 300px; height: 1px; background: rgba(255,255,255,0.1); }
        .cooldown-fill { height: 100%; width: 0%; background: var(--primary); transition: width 2.5s linear; }
    </style>
</head>
<body>

    <!-- Cinematic Entry Launcher -->
    <div id="launcher">
        <div class="launcher-content">
            <div class="launcher-eyebrow">Visual Archives | 04.26.1986</div>
            <h1>Chernobyl</h1>
            <button id="btn-start" class="launcher-btn" disabled>Sincronizando Archivos...</button>
        </div>
    </div>

    <!-- Desktop/Mobile UI -->
    <div id="ui-system">
        <div class="topbar">
            <button class="btn-ui" id="ui-btn-menu">Explorar Galerías</button>
            <button class="btn-ui" id="ui-btn-vr">Entrar VR</button>
        </div>
        <div id="drawer">
            <div class="drawer-head">
                <button class="btn-close-drawer" id="ui-close-drawer">×</button>
                <h3 style="letter-spacing: 0.3em; color: var(--primary);">REGISTROS</h3>
            </div>
            <div id="scene-list"></div>
        </div>
        <div class="scene-hud">
            <div class="hud-name" id="ui-scene-name">EXTERIOR REACTOR 4</div>
        </div>
    </div>

    <div id="scene-loader">
        <div class="loader-spinner"></div>
    </div>

    <div id="cooldown-overlay">
        <div class="cooldown-bar"><div id="cooldown-fill" class="cooldown-fill"></div></div>
    </div>

    <!-- 3D Scene -->
    <a-scene
        renderer="antialias: true; colorManagement: true; logarithmicDepthBuffer: true; highRefreshRate: true;"
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false">
        
        <a-assets>
            <audio id="snd-click" src="https://cdn.aframe.io/360-video-example/audio/click.mp3"></audio>
            <audio id="snd-ambient" src="Audios/menu_principal.mp3" loop></audio>
        </a-assets>

        <!-- Background Panorama (Default: Exterior) -->
        <a-sky id="sky" src="Imagenes/menu_principal.png" radius="500" rotation="0 -90 0"></a-sky>

        <!-- Interactive Roots -->
        <a-entity id="hotspot-container"></a-entity>
        <a-entity id="panel-container"></a-entity>
        <a-entity id="vr-ui-container"></a-entity>

        <!-- Camera Rig with Cinematic Drift -->
        <a-entity id="camera-rig" position="0 1.6 0">
            <a-entity id="main-camera" camera="fov: 80" look-controls>
                <a-entity id="cursor"
                    cursor="fuse: true; fuseTimeout: 1500"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                    material="color: white; shader: flat; opacity: 0.6"
                    raycaster="objects: .clickable"
                    animation__fusing="property: scale; from: 1 1 1; to: 0.15 0.15 0.15; dur: 1500; startEvents: fusing"
                    animation__reset="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave">
                    <a-entity geometry="primitive: ring; radiusInner: 0.028; radiusOuter: 0.03" material="color: #ff6600; opacity: 0"
                        animation__show="property: material.opacity; from: 0; to: 1; dur: 1500; startEvents: fusing"
                        animation__hide="property: material.opacity; to: 0; dur: 200; startEvents: mouseleave"></a-entity>
                </a-entity>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        /**
         * ── CHERNOBYL VR | MASTER REBUILD ────────────────────────────
         * Logic focused on stability, cinematic entry, and VR recovery.
         */

        const App = {
            state: {
                currentScene: "menu_principal.png",
                scenes: {},
                locked: true,
                isVR: false
            },

            async init() {
                console.log("[App] System initializing...");
                
                // Initialize modules
                this.Discovery.init();
                this.UI.init();
                
                // Start subtle drift effect on camera rig
                this.applyCinematicDrift();

                // Wait for A-Frame to be ready
                const sceneEl = document.querySelector('a-scene');
                if (sceneEl.hasLoaded) this.onReady();
                else sceneEl.addEventListener('loaded', () => this.onReady());
            },

            onReady() {
                console.log("[App] Assets Ready.");
                const btn = document.getElementById('btn-start');
                btn.textContent = "INICIAR EXPERIENCIA";
                btn.disabled = false;
            },

            start() {
                document.getElementById('launcher').classList.add('hidden');
                document.getElementById('ui-system').classList.add('visible');
                
                // Load assets for initial scene
                this.Scene.load("menu_principal.png");
                
                // Start Audio
                document.getElementById('snd-ambient').play();
            },

            applyCinematicDrift() {
                const rig = document.getElementById('camera-rig');
                let t = 0;
                setInterval(() => {
                    t += 0.005;
                    rig.object3D.rotation.y = Math.sin(t) * 0.05;
                    rig.object3D.rotation.x = Math.cos(t * 0.8) * 0.02;
                }, 16);
            }
        };

        // ── DISCOVERY: SUPER AUTOMATIC SCANNER ────────────────────────
        App.Discovery = {
            // Updated automatically with current folder contents
            masterRegistry: ["control_room_1.png", "control_room_2.png", "control_room_3.png", "control_room_3_quemado.png", "control_room_4.png", "menu_principal.png"],
            
            prefixes: ["control_room_", "reactor_", "exterior_", "sala_", "room_", "scene_", "img_", "panorama_", "view_", "photo_"],
            extensions: [".png", ".jpg", ".jpeg", ".webp"],

            async init() {
                console.log("[Discovery] Starting Super Scan...");
                
                // 1. Try to fetch the directory listing (Works on many local servers)
                try {
                    const response = await fetch('Imagenes/');
                    const text = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(text, 'text/html');
                    const links = Array.from(doc.querySelectorAll('a'));
                    
                    console.log("[Discovery] Directory listing found. Parsing links...");
                    for (let link of links) {
                        const href = link.getAttribute('href');
                        if (href && (href.endsWith('.png') || href.endsWith('.jpg') || href.endsWith('.jpeg') || href.endsWith('.webp'))) {
                            const filename = href.split('/').pop();
                            if (filename) await this.probe(filename);
                        }
                    }
                } catch (e) {
                    console.log("[Discovery] Directory listing not available (Normal for GitHub). Using Brute Force...");
                }

                // 2. Load the Master Registry (Hardcoded files)
                for (let f of this.masterRegistry) {
                    await this.probe(f);
                }

                // 3. Proactive wide-range probe (Indices 1-20)
                const totalProbes = [];
                this.prefixes.forEach(p => {
                    for(let i=1; i<=20; i++) {
                        this.extensions.forEach(ext => {
                            totalProbes.push(`${p}${i}${ext}`);
                            totalProbes.push(`${i}${ext}`);
                        });
                    }
                });

                const uniqueProbes = [...new Set(totalProbes)].filter(p => !this.masterRegistry.includes(p));

                // Execute probes in batches
                const batchSize = 10;
                for (let i = 0; i < uniqueProbes.length; i += batchSize) {
                    const batch = uniqueProbes.slice(i, i + batchSize);
                    await Promise.all(batch.map(filename => this.probe(filename)));
                }

                console.log("[Discovery] Final Scene Count:", Object.keys(App.state.scenes).length);
            },

            async probe(filename) {
                if (App.state.scenes[filename]) return;
                
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => {
                        console.log(`[Discovery] ✅ DETECTED: ${filename}`);
                        App.state.scenes[filename] = {
                            id: filename,
                            title: this.getCleanName(filename),
                            path: `Imagenes/${filename}`
                        };
                        this.renderGallery();
                        resolve(true);
                    };
                    img.onerror = () => resolve(false);
                    img.src = `Imagenes/${filename}`;
                });
            },

            getCleanName(file) {
                const mapping = {
                    "menu_principal.png": "Exterior Reactor 4",
                    "control_room_1.png": "Sala de Control A",
                    "control_room_2.png": "Sala de Control B",
                    "control_room_3.png": "Sala de Control C",
                    "control_room_3_quemado.png": "Reactor 4 (Colapso)",
                    "control_room_4.png": "Sala de Control D"
                };
                if (mapping[file]) return mapping[file];

                let n = file.split('.')[0].replace(/_/g, " ");
                return n.split(" ").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
            },

            renderGallery() {
                const list = document.getElementById('scene-list');
                if (!list) return;
                const sortedScenes = Object.values(App.state.scenes).sort((a, b) => a.title.localeCompare(b.title));
                list.innerHTML = "";
                sortedScenes.forEach(scene => {
                    const el = document.createElement('div');
                    el.className = "scene-item" + (App.state.currentScene === scene.id ? " active" : "");
                    el.innerHTML = `<strong>${scene.title}</strong>`;
                    el.onclick = () => App.Scene.load(scene.id);
                    list.appendChild(el);
                });
            }
        };

        // ── SCENE: MANAGEMENT & LOGIC ───────────────────────────────
        App.Scene = {
            load(id) {
                if (App.state.locked && App.state.currentScene !== id) return;
                console.log(`[App] Transitioning to ${id}`);
                
                const loader = document.getElementById('scene-loader');
                loader.classList.add('active');

                // Cleanup existing scene items
                App.Hotspots.clear();
                App.VRMenu.clear();

                setTimeout(() => {
                    document.getElementById('sky').setAttribute('src', `Imagenes/${id}`);
                    App.state.currentScene = id;
                    document.getElementById('ui-scene-name').textContent = App.state.scenes[id]?.title || "PROCESANDO...";
                    
                    // Rebuild scene specific systems
                    App.Hotspots.spawn(id);
                    App.VRMenu.build();
                    App.Discovery.renderGallery();
                    
                    loader.classList.remove('active');
                    this.setCooldown(2500);
                }, 800);
            },

            setCooldown(ms) {
                App.state.locked = true;
                const ov = document.getElementById('cooldown-overlay');
                const fill = document.getElementById('cooldown-fill');
                ov.classList.add('active');
                fill.style.transition = "none";
                fill.style.width = "0%";
                setTimeout(() => {
                    fill.style.transition = `width ${ms}ms linear`;
                    fill.style.width = "100%";
                }, 50);
                setTimeout(() => {
                    App.state.locked = false;
                    ov.classList.remove('active');
                }, ms);
            }
        };

        // ── HOTSPOTS: MARKERS & INFO ────────────────────────────────
        App.Hotspots = {
            // Hotspot Database
            db: {
                "menu_principal.png": [
                    { pos: "1 1.5 -4", title: "SARCOFAGO", desc: "Contenedor de seguridad de 100 años diseñado para cubrir el reactor destruido." },
                    { pos: "-2.5 1.2 -3.5", title: "ZONA DE EXCLUSION", desc: "Radio de 30 km donde la vida humana fue evacuada permanentemente." }
                ],
                "control_room_1.png": [
                    { pos: "0 1.8 -3.5", title: "SALA DE CONTROL A", desc: "Puesto de mando principal donde se ejecutaba el test de seguridad fatidico." }
                ],
                "control_room_3_quemado.png": [
                    { pos: "0 1.5 -3", title: "NUCLEO FUNDIDO", desc: "El centro del desastre. La radiación aqui fundio el concreto y el acero.", danger: true }
                ]
            },

            spawn(id) {
                const root = document.getElementById('hotspot-container');
                let items = this.db[id];
                
                // If no manual hotspots, create a generic one for discovery
                if (!items) {
                    items = [{ pos: "2 1.6 -3", title: "NUEVO SECTOR", desc: "Este sector ha sido detectado por el sistema de escaneo automático. No hay registros históricos detallados para este punto aún." }];
                }
                
                items.forEach(h => {
                    const el = document.createElement('a-entity');
                    el.setAttribute('class', 'clickable');
                    el.setAttribute('position', h.pos);
                    el.setAttribute('geometry', 'primitive: circle; radius: 0.12');
                    el.setAttribute('material', {
                        color: h.danger ? '#ff3300' : '#ff6600',
                        shader: 'flat',
                        side: 'double',
                        opacity: 0.9
                    });
                    
                    // Add a glowing border
                    const ring = document.createElement('a-entity');
                    ring.setAttribute('geometry', 'primitive: ring; radiusInner: 0.13; radiusOuter: 0.15');
                    ring.setAttribute('material', 'color: #fff; shader: flat; opacity: 0.4');
                    el.appendChild(ring);

                    el.setAttribute('look-at', '[camera]');
                    el.setAttribute('animation__pulse', 'property: scale; from: 1 1 1; to: 1.15 1.15 1.15; dur: 1000; dir: alternate; loop: true');
                    
                    el.addEventListener('click', () => this.showPanel(h));
                    root.appendChild(el);
                });
            },

            showPanel(h) {
                const root = document.getElementById('panel-container');
                root.innerHTML = "";
                
                // Play sound
                const click = document.getElementById('snd-click');
                if (click) click.play();

                const panel = document.createElement('a-entity');
                // Position panel slightly in front of the hotspot to avoid blocking
                panel.setAttribute('position', '0 0 0.5'); 
                panel.setAttribute('look-at', '[camera]');
                
                panel.innerHTML = `
                    <a-plane width="2.8" height="1.4" material="color: #000; opacity: 0.98; shader: flat">
                        <a-text value="${h.title.toUpperCase()}" align="center" width="4" position="0 0.45 0.02" color="#ff6600"></a-text>
                        <a-text value="${h.desc}" align="center" width="3" position="0 -0.1 0.02" wrap-count="30"></a-text>
                        <a-plane class="clickable" width="0.8" height="0.3" position="0 -0.5 0.05" material="color: #ff6600; shader: flat">
                            <a-text value="CERRAR" align="center" width="2.5" position="0 0 0.01" color="#000"></a-text>
                        </a-plane>
                    </a-plane>
                `;
                
                const closeBtn = panel.querySelector('a-plane.clickable');
                closeBtn.addEventListener('mouseenter', () => closeBtn.setAttribute('material', 'color', '#ffffff'));
                closeBtn.addEventListener('mouseleave', () => closeBtn.setAttribute('material', 'color', '#ff6600'));
                closeBtn.addEventListener('click', () => {
                    root.innerHTML = "";
                    if (click) click.play();
                });
                
                root.appendChild(panel);
            },

            clear() {
                document.getElementById('hotspot-container').innerHTML = "";
                document.getElementById('panel-container').innerHTML = "";
            }
        };

        // ── VR MENU: IN-SCENE 3D HUD ────────────────────────────────
        App.VRMenu = {
            build() {
                const root = document.getElementById('vr-ui-container');
                root.innerHTML = "";
                
                const menu = document.createElement('a-entity');
                menu.setAttribute('position', '0 0.8 -3');
                menu.setAttribute('rotation', '-15 0 0');

                // Panel Background
                const bg = document.createElement('a-plane');
                bg.setAttribute('width', '2.5');
                bg.setAttribute('height', '0.45');
                bg.setAttribute('material', 'color: #111; opacity: 0.9; shader: flat');
                bg.setAttribute('position', '0 0 0');
                
                // Controls
                const btnPrev = this.createBtn("< ANTERIOR", -0.85, () => this.navigate(-1));
                const btnHome = this.createBtn("INICIO", 0, () => App.Scene.load("menu_principal.png"));
                const btnNext = this.createBtn("SIGUIENTE >", 0.85, () => this.navigate(1));

                menu.appendChild(bg);
                menu.appendChild(btnPrev);
                menu.appendChild(btnHome);
                menu.appendChild(btnNext);
                root.appendChild(menu);
            },

            createBtn(text, x, cb) {
                const el = document.createElement('a-entity');
                el.setAttribute('position', `${x} 0 0.05`);
                el.setAttribute('class', 'clickable');
                
                const txt = document.createElement('a-text');
                txt.setAttribute('value', text);
                txt.setAttribute('align', 'center');
                txt.setAttribute('width', '2.2');
                txt.setAttribute('color', '#fff');
                txt.setAttribute('position', '0 0 0.01');
                
                const hit = document.createElement('a-plane');
                hit.setAttribute('width', '0.7');
                hit.setAttribute('height', '0.35');
                hit.setAttribute('material', 'color: #ff6600; opacity: 0; shader: flat');

                el.appendChild(txt);
                el.appendChild(hit);
                
                el.addEventListener('mouseenter', () => hit.setAttribute('material', 'opacity', '0.2'));
                el.addEventListener('mouseleave', () => hit.setAttribute('material', 'opacity', '0'));
                el.addEventListener('click', cb);
                return el;
            },

            navigate(dir) {
                const keys = Object.keys(App.state.scenes);
                const cur = keys.indexOf(App.state.currentScene);
                let next = cur + dir;
                if (next < 0) next = keys.length - 1;
                if (next >= keys.length) next = 0;
                App.Scene.load(keys[next]);
            },

            clear() { document.getElementById('vr-ui-container').innerHTML = ""; }
        };

        // ── UI: DOM WRAPPER ──────────────────────────────────────────
        App.UI = {
            init() {
                document.getElementById('btn-start').onclick = () => App.start();
                document.getElementById('ui-btn-menu').onclick = () => document.getElementById('drawer').classList.add('open');
                document.getElementById('ui-close-drawer').onclick = () => document.getElementById('drawer').classList.remove('open');
                document.getElementById('ui-btn-vr').onclick = () => document.querySelector('a-scene').enterVR();
            }
        };

        window.onload = () => App.init();
    </script>
</body>
</html>
