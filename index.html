<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CHERNOBYL VR | Experiencia Inmersiva</title>
    
    <!-- SEO & Social Media -->
    <meta name="description" content="Explora el reactor 4 de Chernobyl en una experiencia VR inmersiva y educativa.">
    <meta name="keywords" content="Chernobyl, VR, Realidad Virtual, A-Frame, Historia, Reactor 4">
    <meta property="og:title" content="CHERNOBYL VR | Experiencia Inmersiva">
    <meta property="og:description" content="Recorrido histórico interactivo por la sala de control del reactor 4.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#ff6600">

    <!-- Fonts & A-Frame -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;600;900&display=swap" rel="stylesheet">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
        :root {
            --primary: #ff6600;
            --primary-glow: rgba(255, 102, 0, 0.4);
            --secondary: #00eeff;
            --danger: #ff0000;
            --bg: #030303;
            --glass: rgba(10, 10, 10, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font: 'Inter', sans-serif;
            --ease: cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); font-family: var(--font); color: white; overflow: hidden; height: 100dvh; }

        /* ── LAUNCHER ────────────────────────────────────── */
        #launcher {
            position: fixed; inset: 0; z-index: 9999;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 2s var(--ease), visibility 2s;
        }
        #launcher.hidden { opacity: 0; visibility: hidden; }

        .launcher-bg-vfx {
            position: absolute; inset: 0;
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none; opacity: 0.3;
        }

        .launcher-content { position: relative; text-align: center; max-width: 800px; padding: 40px; }
        #launcher h1 {
            font-size: clamp(4rem, 15vw, 8rem); font-weight: 900; letter-spacing: -0.04em;
            text-transform: uppercase; line-height: 0.85; margin-bottom: 60px;
            color: #fff; filter: drop-shadow(0 0 30px var(--primary-glow));
        }

        .launcher-btn {
            background: transparent; border: 1px solid var(--primary); color: var(--primary);
            padding: 24px 80px; font-size: 0.75rem; letter-spacing: 0.5em; font-weight: 700;
            text-transform: uppercase; cursor: pointer; transition: all 0.5s var(--ease);
            position: relative; overflow: hidden; background: rgba(255, 102, 0, 0.05);
        }
        .launcher-btn:hover:not(:disabled) { background: var(--primary); color: black; box-shadow: 0 0 50px var(--primary-glow); transform: scale(1.05); }
        .launcher-btn:disabled { opacity: 0.3; cursor: wait; }

        /* ── UI SYSTEM ────────────────────────────────────── */
        #ui-system { position: fixed; inset: 0; pointer-events: none; z-index: 500; opacity: 0; transition: opacity 1.5s var(--ease); }
        #ui-system.visible { opacity: 1; }

        .topbar {
            position: absolute; top: 0; left: 0; right: 0; padding: 40px 60px;
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            pointer-events: auto;
        }
        .btn-ui {
            background: var(--glass); border: 1px solid var(--glass-border); color: white;
            padding: 14px 28px; font-size: 0.55rem; letter-spacing: 0.3em; font-weight: 700;
            text-transform: uppercase; cursor: pointer; backdrop-filter: blur(20px); transition: all 0.3s;
        }
        .btn-ui:hover { background: white; color: black; transform: translateY(-2px); }

        #drawer {
            position: absolute; top: 0; left: 0; width: 400px; height: 100%;
            background: var(--glass); backdrop-filter: blur(50px); border-right: 1px solid var(--glass-border);
            transform: translateX(-100%); transition: transform 0.8s var(--ease);
            display: flex; flex-direction: column; pointer-events: auto;
        }
        #drawer.open { transform: translateX(0); }
        .drawer-head { padding: 60px 40px; border-bottom: 1px solid var(--glass-border); }
        
        #scene-list { flex: 1; overflow-y: auto; padding: 30px; }
        .scene-item {
            padding: 24px; border-radius: 2px; cursor: pointer; border: 1px solid transparent;
            transition: all 0.4s var(--ease); margin-bottom: 12px; background: rgba(255,255,255,0.02);
        }
        .scene-item:hover { background: rgba(255,102,0,0.08); border-color: rgba(255,102,0,0.2); }
        .scene-item.active { background: rgba(255,102,0,0.15); border-color: var(--primary); }

        .scene-hud { position: absolute; bottom: 60px; left: 60px; pointer-events: none; }
        .hud-name { font-size: 2.5rem; font-weight: 100; text-transform: uppercase; }

        /* Loader */
        #scene-loader {
            position: fixed; inset: 0; z-index: 8000; background: black;
            display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.6s;
        }
        #scene-loader.active { display: flex; opacity: 1; }
        .loader-spinner { width: 50px; height: 50px; border: 1px solid rgba(255,102,0,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Cooldown */
        #cooldown-overlay {
            position: fixed; inset: 0; z-index: 8500; pointer-events: none;
            display: flex; align-items: flex-end; justify-content: center; padding-bottom: 100px; opacity: 0; transition: opacity 0.5s;
        }
        #cooldown-overlay.active { opacity: 1; }
        .cooldown-bar { width: 300px; height: 1px; background: rgba(255,255,255,0.1); overflow: hidden; }
        .cooldown-fill { height: 100%; width: 0%; background: var(--primary); transition: width 3s linear; }

        /* VFX Glitch */
        .glitch-active { animation: ui-glitch 4s infinite; }
        @keyframes ui-glitch {
            0%, 90%, 100% { transform: translate(0); filter: none; }
            92% { transform: translate(-2px, 1px); filter: hue-rotate(90deg); }
            94% { transform: translate(2px, -1px); filter: hue-rotate(-90deg); }
        }
    </style>
</head>
<body>

    <div id="launcher">
        <div class="launcher-bg-vfx"></div>
        <div class="launcher-content">
            <h1>Chernobyl</h1>
            <button id="btn-start" class="launcher-btn" disabled>Sincronizando Archivos...</button>
        </div>
    </div>

    <div id="ui-system">
        <div class="topbar">
            <button class="btn-ui" id="ui-btn-menu">Galería</button>
            <button class="btn-ui" id="ui-btn-vr">VR Mode</button>
        </div>
        <div id="drawer">
            <div class="drawer-head"><h3>SALA DE REGISTROS</h3></div>
            <div id="scene-list"></div>
        </div>
        <div class="scene-hud">
            <div class="hud-name" id="ui-scene-name">CARGANDO...</div>
        </div>
    </div>

    <div id="scene-loader">
        <div class="loader-spinner"></div>
    </div>

    <div id="cooldown-overlay">
        <div class="cooldown-bar"><div id="cooldown-fill" class="cooldown-fill"></div></div>
    </div>

    <a-scene
        renderer="antialias: true; colorManagement: true; logarithmicDepthBuffer: true;"
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false">
        
        <a-assets id="asset-root">
            <audio id="snd-click" src="https://cdn.aframe.io/360-video-example/audio/click.mp3"></audio>
            <audio id="snd-ambient" src="Audios/control-rooms.mp3" loop></audio>
        </a-assets>

        <a-sky id="sky" radius="500" rotation="0 -90 0"></a-sky>

        <!-- Dynamic Content Roots -->
        <a-entity id="hotspot-container"></a-entity>
        <a-entity id="panel-container"></a-entity>
        <a-entity id="vr-nav-container"></a-entity>

        <a-entity id="camera-rig" position="0 1.6 0">
            <a-entity id="main-camera" camera="fov: 80" look-controls>
                <a-entity id="cursor"
                    cursor="fuse: true; fuseTimeout: 1500"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                    material="color: white; shader: flat; opacity: 0.6"
                    raycaster="objects: .clickable"
                    animation__fusing="property: scale; from: 1 1 1; to: 0.2 0.2 0.2; dur: 1500; startEvents: fusing"
                    animation__reset="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave">
                    <a-entity geometry="primitive: ring; radiusInner: 0.028; radiusOuter: 0.03" material="color: #ff6600; opacity: 0"
                        animation__show="property: material.opacity; from: 0; to: 1; dur: 1500; startEvents: fusing"
                        animation__hide="property: material.opacity; to: 0; dur: 200; startEvents: mouseleave"></a-entity>
                </a-entity>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        /**
         * ── CHERNOBYL VR CORE ──────────────────────────────────────────
         * Professional modular architecture for static hosting.
         */
        
        const App = {
            state: {
                currentScene: null,
                scenes: {},
                locked: true,
                isVR: false
            },

            async init() {
                console.log("[App] Initializing...");
                this.Discovery.init();
                this.UI.init();
                
                // Final Check
                const sceneEl = document.querySelector('a-scene');
                if (sceneEl.hasLoaded) this.onReady();
                else sceneEl.addEventListener('loaded', () => this.onReady());
            },

            onReady() {
                console.log("[App] Systems Online.");
                const btn = document.getElementById('btn-start');
                btn.textContent = "INICIAR EXPERIENCIA";
                btn.disabled = false;
            },

            start() {
                document.getElementById('launcher').classList.add('hidden');
                document.getElementById('ui-system').classList.add('visible');
                
                // Load first available scene
                const first = Object.keys(this.state.scenes)[0] || "menu_principal.png";
                this.Scene.load(first);
            }
        };

        // ── DISCOVERY: AUTOMATIC PANORAMA SCANNER ──────────────────────
        App.Discovery = {
            prefixes: ["control_room_", "reactor_", "quemado_", "exterior_"],
            fallbacks: ["menu_principal.png", "control_room_1.png", "control_room_2.png", "control_room_3.png", "control_room_3_quemado.png", "control_room_4.png"],

            async init() {
                console.log("[Discovery] Scanning for assets...");
                
                // 1. Check fallbacks first to ensure core content
                for (let f of this.fallbacks) {
                    await this.probe(f);
                }

                // 2. Dynamic probe (indices 1-10 for each prefix)
                const probes = [];
                this.prefixes.forEach(p => {
                    for(let i=1; i<=10; i++) probes.push(`${p}${i}.png`);
                });

                // Run probes in parallel batches to speed up
                for(let i=0; i<probes.length; i+=5) {
                    await Promise.all(probes.slice(i, i+5).map(p => this.probe(p)));
                }

                this.buildGallery();
            },

            async probe(filename) {
                if (App.state.scenes[filename]) return; // Skip if already found
                
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => {
                        console.log(`[Discovery] Found: ${filename}`);
                        App.state.scenes[filename] = {
                            id: filename,
                            title: this.formatName(filename),
                            path: `Imagenes/${filename}`
                        };
                        resolve(true);
                    };
                    img.onerror = () => resolve(false);
                    img.src = `Imagenes/${filename}`;
                });
            },

            formatName(file) {
                let name = file.replace(".png", "").replace(".jpg", "").replace(/_/g, " ");
                return name.split(" ").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
            },

            buildGallery() {
                const list = document.getElementById('scene-list');
                list.innerHTML = "";
                Object.values(App.state.scenes).forEach(scene => {
                    const el = document.createElement('div');
                    el.className = "scene-item";
                    el.innerHTML = `<strong>${scene.title}</strong>`;
                    el.onclick = () => App.Scene.load(scene.id);
                    list.appendChild(el);
                });
            }
        };

        // ── SCENE: TRANSITIONS & LOADING ───────────────────────────────
        App.Scene = {
            async load(id) {
                if (App.state.locked && App.state.currentScene) return;
                console.log(`[Scene] Loading ${id}...`);
                
                const loader = document.getElementById('scene-loader');
                loader.classList.add('active');

                try {
                    const sky = document.getElementById('sky');
                    sky.setAttribute('src', `Imagenes/${id}`);
                    
                    App.state.currentScene = id;
                    document.getElementById('ui-scene-name').textContent = App.state.scenes[id]?.title || "EXTERIOR";
                    
                    // Cleanup & Rebuild
                    App.Hotspots.clear();
                    App.Hotspots.spawn(id);
                    App.UI.updateRegistry(id);
                    App.VRMenu.rebuild();
                    
                    // Audio
                    const ambient = document.getElementById('snd-ambient');
                    if (ambient.paused) ambient.play();

                    this.setCooldown(2500);
                } catch (e) {
                    console.error("[Scene] Load Error:", e);
                }

                setTimeout(() => loader.classList.remove('active'), 800);
            },

            setCooldown(ms) {
                App.state.locked = true;
                const overlay = document.getElementById('cooldown-overlay');
                const fill = document.getElementById('cooldown-fill');
                
                overlay.classList.add('active');
                fill.style.transition = "none";
                fill.style.width = "0%";
                
                setTimeout(() => {
                    fill.style.transition = `width ${ms}ms linear`;
                    fill.style.width = "100%";
                }, 50);

                setTimeout(() => {
                    App.state.locked = false;
                    overlay.classList.remove('active');
                }, ms);
            }
        };

        // ── HOTSPOTS: INFORMATION MARKERS ──────────────────────────────
        App.Hotspots = {
            data: {
                "menu_principal.png": [
                    { pos: "2 1.5 -4", title: "Sarcófago", desc: "La estructura de acero diseñada para contener los restos del Reactor 4." },
                    { pos: "-3 1.2 -3", title: "Nivel de Radiación", desc: "En esta zona exterior el nivel es de 0.15 μSv/h." }
                ],
                "control_room_1.png": [
                    { pos: "0 1.8 -3", title: "Paneles AZ-5", desc: "El botón de parada de emergencia que irónicamente gatilló el desastre." }
                ],
                "control_room_3_quemado.png": [
                    { pos: "0 1.5 -3", title: "NÚCLEO EXPUESTO", desc: "Radiación letal. Los operarios aquí recibieron dosis fatales en minutos.", danger: true }
                ]
            },

            spawn(id) {
                const container = document.getElementById('hotspot-container');
                const items = this.data[id] || [];
                
                items.forEach(h => {
                    const el = document.createElement('a-entity');
                    el.setAttribute('class', 'clickable');
                    el.setAttribute('position', h.pos);
                    el.setAttribute('geometry', 'primitive: circle; radius: 0.12');
                    el.setAttribute('material', {
                        color: h.danger ? '#ff0000' : '#ff6600',
                        shader: 'flat',
                        side: 'double',
                        opacity: 0.8
                    });
                    el.setAttribute('look-at', '[camera]');
                    el.setAttribute('animation__pulse', 'property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dur: 800; dir: alternate; loop: true');
                    
                    el.addEventListener('click', () => this.showInfo(h));
                    container.appendChild(el);
                });
            },

            showInfo(h) {
                const root = document.getElementById('panel-container');
                root.innerHTML = "";
                
                const panel = document.createElement('a-entity');
                panel.setAttribute('look-at', '[camera]');
                panel.innerHTML = `
                    <a-plane width="2.5" height="1.2" material="color: #000; opacity: 0.9; shader: flat">
                        <a-text value="${h.title.toUpperCase()}" align="center" width="4" position="0 0.35 0.01" color="#ff6600" font="roboto"></a-text>
                        <a-text value="${h.desc}" align="center" width="3" position="0 -0.1 0.01" wrap-count="30"></a-text>
                        <a-plane class="clickable" width="0.6" height="0.2" position="0 -0.45 0.02" material="color: #333">
                            <a-text value="CERRAR" align="center" width="2" position="0 0 0.01"></a-text>
                        </a-plane>
                    </a-plane>
                `;
                panel.querySelector('a-plane').addEventListener('click', () => root.innerHTML = "");
                root.appendChild(panel);
            },

            clear() {
                document.getElementById('hotspot-container').innerHTML = "";
                document.getElementById('panel-container').innerHTML = "";
            }
        };

        // ── VR MENU: IN-SCENE INTERFACE ───────────────────────────────
        App.VRMenu = {
            rebuild() {
                const root = document.getElementById('vr-nav-container');
                root.innerHTML = "";
                
                // Floating Menu in front of user
                const menu = document.createElement('a-entity');
                menu.setAttribute('position', '0 0.8 -3');
                menu.setAttribute('rotation', '-20 0 0');

                const bg = document.createElement('a-plane');
                bg.setAttribute('width', '2.5');
                bg.setAttribute('height', '0.4');
                bg.setAttribute('material', 'color: #000; opacity: 0.7; shader: flat');
                
                const btnPrev = this.createBtn("< ANTERIOR", -0.8, () => this.nav(-1));
                const btnHome = this.createBtn("GALERIA", 0, () => document.getElementById('ui-btn-menu').click());
                const btnNext = this.createBtn("SIGUIENTE >", 0.8, () => this.nav(1));

                menu.appendChild(bg);
                menu.appendChild(btnPrev);
                menu.appendChild(btnHome);
                menu.appendChild(btnNext);
                root.appendChild(menu);
            },

            createBtn(text, x, cb) {
                const el = document.createElement('a-entity');
                el.setAttribute('position', `${x} 0 0.01`);
                el.setAttribute('class', 'clickable');
                
                const txt = document.createElement('a-text');
                txt.setAttribute('value', text);
                txt.setAttribute('align', 'center');
                txt.setAttribute('width', '2');
                
                const hit = document.createElement('a-plane');
                hit.setAttribute('width', '0.7');
                hit.setAttribute('height', '0.3');
                hit.setAttribute('material', 'visible: false');

                el.appendChild(txt);
                el.appendChild(hit);
                el.addEventListener('click', cb);
                return el;
            },

            nav(dir) {
                const keys = Object.keys(App.state.scenes);
                const curIdx = keys.indexOf(App.state.currentScene);
                let nextIdx = curIdx + dir;
                if (nextIdx < 0) nextIdx = keys.length - 1;
                if (nextIdx >= keys.length) nextIdx = 0;
                App.Scene.load(keys[nextIdx]);
            }
        };

        // ── UI: 2D INTERFACE BINDINGS ─────────────────────────────────
        App.UI = {
            init() {
                document.getElementById('btn-start').onclick = () => App.start();
                document.getElementById('ui-btn-menu').onclick = () => document.getElementById('drawer').classList.toggle('open');
                document.getElementById('ui-btn-vr').onclick = () => document.querySelector('a-scene').enterVR();
            },
            updateRegistry(id) {
                const items = document.querySelectorAll('.scene-item');
                items.forEach(el => {
                    el.classList.remove('active');
                    if (el.textContent.includes(App.state.scenes[id]?.title)) el.classList.add('active');
                });
            }
        };

        // Start everything
        window.onload = () => App.init();

    </script>
</body>
</html>
