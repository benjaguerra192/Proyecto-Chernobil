<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CHERNOBYL VR | Enterprise Archival System V9.0</title>
    <meta name="description" content="Sistema de archivo inmersivo 3D. Entorno de simulaci&oacute;n hist&oacute;rica de la zona de exclusi&oacute;n.">
    <meta name="theme-color" content="#ff5500">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #ff5500;
            --primary-dim: rgba(255,85,0,0.15);
            --primary-glow: rgba(255,85,0,0.6);
            --primary-soft: rgba(255,180,80,0.3);
            --bg: #030303;
            --surface: rgba(10,10,10,0.94);
            --surface-light: rgba(20,20,20,0.88);
            --border: rgba(255,255,255,0.06);
            --border-light: rgba(255,255,255,0.12);
            --text: #e0e0e0;
            --text-dim: #666;
            --text-bright: #ffffff;
            --font-main: 'Inter', 'Segoe UI', system-ui, sans-serif;
            --font-code: 'JetBrains Mono', monospace;
            --ease: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --radius: 3px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 40px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); font-family: var(--font-main); color: var(--text); overflow: hidden; height: 100dvh; width: 100dvw; user-select: none; -webkit-font-smoothing: antialiased; }

        /* === OVERLAY === */
        .overlay { position: fixed; inset: 0; z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(30px) saturate(1.2); transition: opacity 1.2s var(--ease-out), transform 1.2s var(--ease-out); }
        .overlay.hidden { opacity: 0; pointer-events: none; transform: scale(1.02); }

        /* === LAUNCHER === */
        #launcher {
            background:
                radial-gradient(circle at 50% 42%, rgba(255,85,0,0.12), transparent 34%),
                linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.92)),
                url('./Imagenes/menu_principal.png') center/cover no-repeat;
            padding: 28px;
            text-align: center;
        }
        .launch-tag { font-family: var(--font-code); font-size: 0.65rem; letter-spacing: 0.55em; color: var(--primary); text-transform: uppercase; margin-bottom: var(--spacing-lg); font-weight: 700; animation: pulse 4s infinite; }
        .launch-title {
            font-size: clamp(3.1rem, 11vw, 7.4rem);
            font-family: var(--font-main);
            font-weight: 300;
            text-transform: uppercase;
            line-height: 0.95;
            letter-spacing: 0.12em;
            text-shadow: 0 0 40px var(--primary-soft), 0 0 80px rgba(255,85,0,0.1);
            margin-bottom: 42px;
            color: var(--text-bright);
        }
        .btn-launch {
            background: rgba(0,0,0,0.42);
            border: 1px solid rgba(255,255,255,0.18);
            color: var(--text);
            min-width: min(360px, 82vw);
            padding: 17px 28px;
            font-size: 0.75rem;
            letter-spacing: 0.34em;
            font-weight: 700;
            font-family: var(--font-code);
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s var(--ease);
            position: relative;
            border-radius: 2px;
            backdrop-filter: blur(8px);
        }
        .btn-launch:hover:not(:disabled) {
            border-color: var(--primary);
            color: #000;
            background: var(--primary);
            box-shadow: 0 0 40px var(--primary-glow), 0 4px 20px rgba(0,0,0,0.5);
            transform: translateY(-2px);
        }
        .btn-launch:disabled { opacity: 0.15; cursor: wait; border-style: dashed; }

        /* === HUD === */
        #hud { position: fixed; inset: 0; pointer-events: none; z-index: 1000; opacity: 0; transition: opacity 1.5s var(--ease-out); }
        #hud.active { opacity: 1; }
        .hud-top {
            position: absolute; top: 0; left: 0; right: 0;
            padding: 24px 32px;
            display: flex; gap: var(--spacing-sm); align-items: center;
            pointer-events: auto;
            background: linear-gradient(180deg, rgba(0,0,0,0.74) 0%, rgba(0,0,0,0.34) 58%, transparent 100%);
        }
        .hud-top-right { margin-left: auto; }
        .hud-btn {
            background: rgba(5,5,5,0.78);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.68);
            min-height: 36px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: 600;
            font-family: var(--font-code);
            font-size: 0.65rem;
            letter-spacing: 0.14em;
            border-radius: var(--radius);
            backdrop-filter: blur(8px);
            transition: all 0.3s var(--ease);
        }
        .hud-btn:hover {
            color: var(--text-bright);
            border-color: var(--border-light);
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 12px rgba(255,255,255,0.03);
        }
        .hud-btn--vr { border-color: var(--primary); color: var(--primary); }
        .hud-btn--vr:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary-glow); }
        .hud-bottom {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 34px var(--spacing-xl) 28px;
            pointer-events: none;
            background: linear-gradient(0deg, rgba(0,0,0,0.84) 0%, rgba(0,0,0,0.36) 64%, transparent 100%);
            border-bottom: 2px solid rgba(255,85,0,0.9);
        }
        .hud-scene-title {
            font-size: clamp(2rem, 5vw, 3.1rem);
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.10em;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 0 15px var(--primary-soft);
        }
        .hud-scene-meta {
            font-family: var(--font-code);
            color: var(--primary);
            font-size: clamp(0.62rem, 1.5vw, 0.8rem);
            letter-spacing: 0.24em;
            margin-top: var(--spacing-sm);
            opacity: 0.85;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        /* === SIDEBAR === */
        #sidebar {
            position: absolute; left: -300px; top: 80px; bottom: 80px; width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--primary);
            transition: left 0.35s var(--ease-out);
            display: flex; flex-direction: column;
            pointer-events: auto;
            backdrop-filter: blur(16px);
            z-index: 1500;
            border-radius: 0 var(--radius) var(--radius) 0;
        }
        #sidebar.open { left: 0; }
        .sidebar-head {
            padding: var(--spacing-md) 20px;
            font-family: var(--font-code);
            color: var(--primary);
            font-size: 0.6rem;
            letter-spacing: 0.25em;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-list { flex: 1; overflow-y: auto; }
        .sidebar-item {
            display: block; width: 100%; text-align: left;
            background: transparent; border: none;
            color: var(--text-dim);
            padding: 14px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: all 0.25s var(--ease);
            font-family: var(--font-code);
            font-size: 0.68rem;
            letter-spacing: 0.05em;
            border-left: 3px solid transparent;
        }
        .sidebar-item:hover, .sidebar-item.active {
            background: var(--primary-dim);
            color: var(--text-bright);
            border-left-color: var(--primary);
            padding-left: 24px;
        }

        /* === BLACKOUT + LOADER === */
        #blackout { position: fixed; inset: 0; background: #000; z-index: 8000; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        #blackout.active { opacity: 1; pointer-events: auto; }
        .loader-wrap { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; gap: var(--spacing-lg); }
        .loader-spin {
            width: 40px; height: 40px;
            border: 1.5px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loader-label {
            font-family: var(--font-code);
            font-size: 0.55rem;
            letter-spacing: 0.5em;
            color: var(--primary);
            opacity: 0.8;
        }

        /* === TELEMETRY === */
        #telemetry {
            position: fixed; bottom: var(--spacing-md); right: var(--spacing-md);
            width: 380px; max-height: 200px;
            background: rgba(5,5,5,0.94);
            border: 1px solid #1a1a1a;
            padding: 10px;
            font-family: var(--font-code);
            font-size: 9px;
            color: #555;
            z-index: 10000;
            overflow-y: auto;
            display: none;
            border-radius: var(--radius);
            pointer-events: none;
            opacity: 0.7;
        }
        body.debug #telemetry { display: block; }

        @media (max-width: 720px) {
            .launch-tag { font-size: 0.55rem; letter-spacing: 0.32em; }
            .launch-title { letter-spacing: 0.08em; }
            .hud-top {
                padding: 14px;
                flex-wrap: wrap;
                align-content: flex-start;
            }
            .hud-btn {
                flex: 1 1 auto;
                min-width: 0;
                padding: 10px 12px;
                font-size: 0.58rem;
                letter-spacing: 0.08em;
            }
            .hud-top-right { margin-left: 0; }
            .hud-bottom { padding: 24px 18px 22px; }
            .hud-scene-meta { letter-spacing: 0.12em; line-height: 1.6; }
            #sidebar {
                top: 118px;
                bottom: 96px;
                width: min(86vw, 300px);
                left: min(-86vw, -300px);
            }
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>

<body>
    <!-- LAUNCHER -->
    <div id="launcher" class="overlay">
        <div class="launch-tag">INIT SEQUENCE // 1986.04.26</div>
        <h1 class="launch-title">Chernobyl</h1>
        <button id="btn-start" class="btn-launch" disabled>ESTABLECIENDO ENLACE...</button>
    </div>

    <!-- BLACKOUT -->
    <div id="blackout">
        <div class="loader-wrap" id="loader" style="display:none">
            <div class="loader-spin"></div>
            <div class="loader-label">CARGANDO SECTOR</div>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-top">
            <button class="hud-btn" id="btn-gallery">&#8801; GALER&Iacute;A</button>
            <button class="hud-btn" id="btn-prev">&#9664; ANTERIOR</button>
            <button class="hud-btn" id="btn-next">SIGUIENTE &#9654;</button>
            <div class="hud-top-right">
                <button class="hud-btn hud-btn--vr" id="btn-vr">MODO VR</button>
            </div>
        </div>
        <div id="sidebar">
            <div class="sidebar-head">SECTORES</div>
            <div class="sidebar-list" id="sidebar-list"></div>
        </div>
        <div class="hud-bottom">
            <div class="hud-scene-title" id="hud-title">&mdash;</div>
            <div class="hud-scene-meta">CENTRAL NUCLEAR V.I. LENIN // ZONA DE EXCLUSI&Oacute;N</div>
        </div>
    </div>

    <div id="telemetry"></div>

    <!-- A-FRAME SCENE -->
    <a-scene id="core-scene"
        renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true; logarithmicDepthBuffer: true;"
        vr-mode-ui="enabled: false"
        background="color: #000000">

        <a-assets id="engine-assets" timeout="30000">
            <img id="tex-menu_principal-png"        src="./Imagenes/menu_principal.png">
            <img id="tex-control_room_1-png"        src="./Imagenes/control_room_1.png">
            <img id="tex-control_room_2-png"        src="./Imagenes/control_room_2.png">
            <img id="tex-control_room_3-png"        src="./Imagenes/control_room_3.png">
            <img id="tex-control_room_3_quemado-png" src="./Imagenes/control_room_3_quemado.png">
            <img id="tex-control_room_4-png"        src="./Imagenes/control_room_4.png">
            <img id="tex-reactor_control_rods_zone-png" src="./Imagenes/reactor_control_rods_zone.png">
            <img id="tex-reactor_explosion_moment-png" src="./Imagenes/reactor_explosion_moment.png">
            <img id="tex-reactor_roof-png"          src="./Imagenes/reactor_roof.png">
            <img id="tex-elephants_foot-png"        src="./Imagenes/elephants_foot.png">
            <img id="tex-pripyat_ferris_wheel-png"  src="./Imagenes/pripyat_ferris_wheel.png">
        </a-assets>

        <!-- Player Rig -->
        <a-entity id="player-rig" position="0 0 0">
            <a-camera id="player-cam" fov="75" near="0.05" far="6000"
                look-controls="pointerLockEnabled: false; magicWindowTrackingEnabled: true"
                raycaster="objects: .interactable; far: 15; interval: 50; showLine: false">
                
                <!-- Reticle cursor -->
                <a-entity id="reticle" position="0 0 -0.15" scale="0.15 0.15 0.15">
                    <a-ring id="reticle-ring" radius-inner="0.012" radius-outer="0.018"
                        material="color: #ffffff; shader: flat; opacity: 0.99"></a-ring>
                    <a-circle id="reticle-dot" radius="0.005"
                        material="color: #ff5500; shader: flat; opacity: 0.99"></a-circle>
                </a-entity>

                <!-- PERMANENT VR LOCATION TITLE (Fixed to Camera HUD) -->
                <a-entity id="vr-location-title" position="-0.5 -0.45 -1.2" rotation="0 0 0" visible="false">
                    <a-plane id="vr-title-txt" width="1.6" height="0.2" position="0 0 0" material="transparent: true; shader: flat; alphaTest: 0.5" pointer-events="none"></a-plane>
                    <a-plane id="vr-subtitle-txt" width="1.6" height="0.08" position="0 -0.14 0" material="transparent: true; shader: flat; alphaTest: 0.5" pointer-events="none"></a-plane>
                </a-entity>
            </a-camera>
        </a-entity>

        <a-sky id="world-sky" src="#tex-menu_principal-png"
            radius="30" material="shader: flat; color: #fff; side: back" segments-width="64" segments-height="64"></a-sky>

        <!-- UI ANCHOR -- Restored to world space. Repositioned dynamically on open -->
        <a-entity id="ui-anchor" position="0 0 0">
            <!-- VR NAV BAR (Minimalist Glassmorphism) -->
            <a-entity id="vr-menu" position="0 -0.5 -1.6" visible="false">
                <a-entity rotation="-15 0 0">
                    <!-- DRAG HANDLE -->
                    <a-plane class="ui-button" id="menu-drag-handle" width="0.56" height="0.18" position="0 0.28 0.006"
                        material="color: #050607; opacity: 0.08; transparent: true; shader: flat">
                        <a-circle radius="0.028" position="-0.11 0 0.004"
                            material="color: #ff8844; shader: flat; opacity: 0.95"></a-circle>
                        <a-circle radius="0.028" position="0 0 0.004"
                            material="color: #ff8844; shader: flat; opacity: 0.95"></a-circle>
                        <a-circle radius="0.028" position="0.11 0 0.004"
                            material="color: #ff8844; shader: flat; opacity: 0.95"></a-circle>
                    </a-plane>
                    <a-plane id="menu-drag-timer-txt" width="0.72" height="0.10" position="0 0.42 0.008"
                        material="transparent: true; shader: flat; alphaTest: 0.5" visible="false" pointer-events="none"></a-plane>

                    <!-- Premium Glass Background -->
                    <a-plane id="vr-menu-bg" class="raycast-blocker" width="2.2" height="0.22"
                        material="color: #020202; opacity: 0.85; transparent: true; shader: flat; side: double; alphaTest: 0.1"></a-plane>
                    
                    <!-- Neon Industrial Accents -->
                    <a-plane width="2.2" height="0.003" position="0 0.11 0.001"
                        material="color: #ff5500; shader: flat; opacity: 0.9"></a-plane>
                    <a-plane width="2.2" height="0.002" position="0 -0.11 0.001"
                        material="color: #ff5500; shader: flat; opacity: 0.3"></a-plane>

                    <!-- PREV -->
                    <a-plane class="ui-button" id="menu-prev" width="0.38" height="0.16" position="-0.82 0 0.006"
                        material="color: #080808; opacity: 0.6; transparent: true; shader: flat">
                        <a-plane id="menu-prev-txt" width="0.30" height="0.10" position="0 0 0.004"
                            material="transparent: true; shader: flat" pointer-events="none"></a-plane>
                    </a-plane>

                    <!-- GALLERY -->
                    <a-plane class="ui-button" id="menu-gallery" width="0.70" height="0.16" position="-0.22 0 0.006"
                        material="color: #080808; opacity: 0.6; transparent: true; shader: flat">
                        <a-plane id="menu-gal-txt" width="0.62" height="0.10" position="0 0 0.004"
                            material="transparent: true; shader: flat" pointer-events="none"></a-plane>
                    </a-plane>

                    <!-- NEXT -->
                    <a-plane class="ui-button" id="menu-next" width="0.38" height="0.16" position="0.38 0 0.006"
                        material="color: #080808; opacity: 0.6; transparent: true; shader: flat">
                        <a-plane id="menu-next-txt" width="0.30" height="0.10" position="0 0 0.004"
                            material="transparent: true; shader: flat" pointer-events="none"></a-plane>
                    </a-plane>

                    <!-- CLOSE -->
                    <a-plane class="ui-button" id="menu-close" width="0.30" height="0.16" position="0.86 0 0.006"
                        material="color: #100202; opacity: 0.7; transparent: true; shader: flat">
                        <a-plane id="menu-close-txt" width="0.22" height="0.10" position="0 0 0.004"
                            material="transparent: true; shader: flat" pointer-events="none"></a-plane>
                    </a-plane>
                </a-entity>
            </a-entity>

            <!-- VR GALLERY MODAL (Premium) -->
            <a-entity id="vr-gallery" position="0 0 -1.4" scale="1 1 1" visible="false">
                <a-plane id="vr-gallery-bg" class="raycast-blocker" width="2.4" height="1.8"
                    material="color: #020202; opacity: 0.90; transparent: true; shader: flat; side: double; alphaTest: 0.1"></a-plane>
                <a-plane width="2.4" height="0.004" position="0 0.9 0.001"
                    material="color: #ff5500; shader: flat; opacity: 0.9"></a-plane>
                <a-plane id="gal-title-txt" width="2.2" height="0.16" position="0 0.76 0.005"
                    material="transparent: true; shader: flat" pointer-events="none"></a-plane>
                <a-entity id="gallery-grid" position="0 0.2 0.01"></a-entity>
                <a-plane id="gal-close-btn" class="ui-button" position="0 -0.76 0.01" width="0.5" height="0.15"
                    material="color: #100202; opacity: 0.8; transparent: true; shader: flat">
                    <a-plane width="0.5" height="0.002" position="0 0.073 0.001"
                        material="color: #ff3300; shader: flat; opacity: 0.7"></a-plane>
                    <a-plane id="gal-close-txt" width="0.4" height="0.10" position="0 0 0.005"
                        material="transparent: true; shader: flat" pointer-events="none"></a-plane>
                </a-plane>
            </a-entity>
        </a-entity>

        <!-- HOTSPOT MODAL ANCHOR (Independent from Nav Menu) -->
        <a-entity id="modal-anchor" position="0 0 0">
            <!-- VR HOTSPOT MODAL (Premium Cinematic) -->
            <a-entity id="vr-hotspot-modal" position="0 0.15 -1.4" visible="false">
                <a-plane id="vr-hotspot-bg" class="raycast-blocker" width="1.6" height="1.0" material="color: #020202; opacity: 0.92; shader: flat; transparent: true; side: double; alphaTest: 0.1"></a-plane>
                <a-plane width="1.6" height="0.004" position="0 0.498 0.001" material="color: #ff5500; shader: flat; opacity: 0.9"></a-plane>
                <a-plane width="1.6" height="0.002" position="0 -0.498 0.001" material="color: #ff5500; shader: flat; opacity: 0.3"></a-plane>
                
                <a-plane id="modal-hs-title" position="0 0.35 0.01" width="1.4" height="0.20" material="transparent: true; shader: flat" pointer-events="none"></a-plane>
                <a-plane id="modal-hs-desc" position="0 -0.05 0.01" width="1.4" height="0.50" material="transparent: true; shader: flat" pointer-events="none"></a-plane>
                
                <a-plane class="ui-button" id="modal-hs-close" position="0 -0.40 0.01" width="0.7" height="0.15" material="color: #100202; opacity: 0.8; shader: flat; transparent: true">
                    <a-plane width="0.7" height="0.002" position="0 0.073 0.001" material="color: #ff3300; shader: flat; opacity: 0.7"></a-plane>
                    <a-plane id="modal-hs-close-txt" width="0.5" height="0.10" position="0 0 0.004" material="transparent: true; shader: flat" pointer-events="none"></a-plane>
                </a-plane>
            </a-entity>
        </a-entity>

        <!-- HOTSPOT POOL V16 Crisp 2D Circles -->
        <a-entity id="hotspot-pool">
            <a-entity id="hs-1" class="hs-container" visible="false" position="0 -1000 0">
                <a-plane class="hs-audio-tag" position="0 0.25 0" width="0.6" height="0.15" look-at="#player-cam" material="transparent: true; shader: flat; alphaTest: 0.5" visible="false"></a-plane>
                <a-sphere class="hs-core" radius="0.055" position="0 0 0.002" material="color: #ff5500; shader: flat; transparent: true; opacity: 0.96; depthWrite: false"></a-sphere>
                <a-circle class="hs-hitbox" radius="0.25" look-at="#player-cam" material="opacity: 0.0; transparent: true; depthWrite: false"></a-circle>
                <a-ring class="hs-ring1" radius-inner="0.103" radius-outer="0.121" position="0 0 0.001" look-at="#player-cam" material="color: #ff5500; shader: flat; transparent: true; opacity: 0.58; depthWrite: false" animation="property: rotation; to: 0 0 360; dur: 4000; loop: true; easing: linear"></a-ring>
            </a-entity>
            <a-entity id="hs-2" class="hs-container" visible="false" position="0 -1000 0">
